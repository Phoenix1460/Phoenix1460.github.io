<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXcode IQ Music Converter</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #f5f5f5;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        h1, h2 { color: #f9a825; }
        .box {
            background-color: #2a2a35;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        input[type="file"] {
            display: block;
            margin: 15px 0;
            color: #ddd;
        }
        button {
            background-color: #f9a825;
            color: #1e1e24;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background-color: #fff; }
        textarea {
            width: 100%;
            height: 300px;
            background-color: #111;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 4px;
            box-sizing: border-box;
        }
        #status { font-style: italic; color: #aaa; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>🎵 MP3 to VEXcode IQ Python Converter</h1>
    <p>Upload a clean, single-instrument audio file (like an MP3 of a piano tune or melody). The webpage will extract the pitch pitches and auto-generate clean code for your robot brain.</p>

    <div class="box">
        <label for="audioFile"><strong>Select Audio File (.mp3, .wav):</strong></label>
        <input type="file" id="audioFile" accept="audio/*">
        <button onclick="processAudio()">Convert to VEXcode Python</button>
        <div id="status">Ready.</div>
    </div>

    <div class="box">
        <h2>📋 Copy and Paste into VEXcode IQ:</h2>
        <textarea id="outputCode" readonly placeholder="# Python code will appear here after conversion..."></textarea>
    </div>

<!-- Embedded Pitchfinder Library (Bypasses CDN Network Blocks) -->
<script>
const Pitchfinder = {
    YIN: function(config) {
        const sampleRate = config.sampleRate || 44100;
        const threshold = config.threshold || 0.1;
        return function(float32Data) {
            const bufferSize = float32Data.length;
            const halfBufferSize = Math.floor(bufferSize / 2);
            const yinBuffer = new Float32Array(halfBufferSize);
            let i, tau;
            for (tau = 0; tau < halfBufferSize; tau++) {
                for (i = 0; i < halfBufferSize; i++) {
                    const delta = float32Data[i] - float32Data[i + tau];
                    yinBuffer[tau] += delta * delta;
                }
            }
            yinBuffer[0] = 1;
            let runningSum = 0;
            for (tau = 1; tau < halfBufferSize; tau++) {
                runningSum += yinBuffer[tau];
                yinBuffer[tau] *= tau / runningSum;
            }
            let probability = 1, period = -1;
            for (tau = 1; tau < halfBufferSize; tau++) {
                if (yinBuffer[tau] < threshold) {
                    while (tau + 1 < halfBufferSize && yinBuffer[tau + 1] < yinBuffer[tau]) {
                        tau++;
                    }
                    period = tau;
                    probability = 1 - yinBuffer[tau];
                    break;
                }
            }
            if (period === -1) {
                let minTau = 1;
                let minVal = yinBuffer[1];
                for (tau = 2; tau < halfBufferSize; tau++) {
                    if (yinBuffer[tau] < minVal) {
                        minVal = yinBuffer[tau];
                        minTau = tau;
                    }
                }
                period = minTau;
                probability = 1 - minVal;
            }
            if (probability > 0.85) {
                return sampleRate / period;
            }
            return null;
        };
    }
};

async function processAudio() {
    const fileInput = document.getElementById('audioFile');
    const statusDiv = document.getElementById('status');
    const outputArea = document.getElementById('outputCode');

    if (!fileInput.files || fileInput.files.length === 0) {
        alert("Please select an audio file first!");
        return;
    }

    statusDiv.textContent = "Reading audio file channels...";
    const file = fileInput.files[0];
    
    // Initialize Web Audio API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let arrayBuffer;
    try {
        arrayBuffer = await file.arrayBuffer();
    } catch (e) {
        statusDiv.textContent = "Error reading the file matrix.";
        return;
    }
    
    statusDiv.textContent = "Decoding audio data (this can take a moment)...";
    let audioBuffer;
    try {
        audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
    } catch (e) {
        statusDiv.textContent = "Error decoding audio. Make sure it's a standard audio track.";
        return;
    }

    statusDiv.textContent = "Analyzing note frequencies and timing details...";
    const float32Data = audioBuffer.getChannelData(0); 
    const sampleRate = audioBuffer.sampleRate;
    
    const detectPitch = Pitchfinder.YIN({ sampleRate: sampleRate });
    const chunkSize = 2048; 
    let songSequence = [];

    for (let i = 0; i < float32Data.length; i += chunkSize) {
        const chunk = float32Data.subarray(i, i + chunkSize);
        const frequency = detectPitch(chunk);
        
        if (frequency) {
            const midiNote = Math.round(12 * (Math.log2(frequency / 440)) + 69);
            if (midiNote >= 24 && midiNote <= 108) {
                const timestampMs = Math.round((i / sampleRate) * 1000);
                songSequence.push({ note: midiNote, time: timestampMs });
            }
        }
    }

    if (songSequence.length === 0) {
        statusDiv.textContent = "Could not detect clear musical notes. Try a simpler solo instrument track.";
        return;
    }

    statusDiv.textContent = "Compiling notes into structural VEXcode delays...";
    
    let finalCode = `myVariable = 0\n\ndef play_song():\n`;
    let lastTime = 0;
    const defaultDuration = 250; 

    for (let i = 0; i < songSequence.length; i++) {
        let currentItem = songSequence[i];
        
        if (i === 0 || songSequence[i].note !== songSequence[i-1].note || (currentItem.time - lastTime) > 300) {
            let waitDelay = currentItem.time - lastTime;
            
            if (waitDelay > 30 && i > 0) {
                finalCode += `    wait(${waitDelay}, MSEC)\n`;
            }
            
            let octave = Math.floor((currentItem.note - 12) / 12);
            let vexNote = currentItem.note % 12;
            
            if (octave < 3) octave = 3;
            if (octave > 7) octave = 7;

            finalCode += `    brain.play_note(${octave}, ${vexNote}, ${defaultDuration})\n`;
            lastTime = currentItem.time + defaultDuration;
        }
    }

    finalCode += `\nplay_song()\n`;
    
    outputArea.value = finalCode;
    statusDiv.textContent = "Done! Code fully optimized for VEXcode IQ.";
}
</script>

</body>
</html>
