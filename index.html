<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Storage Optimizer</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: #ffffff;
            color: #000000;
        }
        .drop-zone {
            border: 2px dashed #000000;
            padding: 40px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .drop-zone.hover {
            background: #f0f0f0;
        }
        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            background: #000000;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: 500;
        }
        button:hover {
            opacity: 0.8;
        }
        .stats {
            font-size: 14px;
            line-height: 1.6;
            border: 1px solid #000000;
            padding: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <h1>File Storage Optimizer</h1>
    
    <div id="dropZone" class="drop-zone">
        Drag and drop your file here, or click to select
        <input type="file" id="fileInput" style="display: none;">
    </div>

    <div class="actions">
        <button onclick="processFile(true)">Compress</button>
        <button onclick="processFile(false)">Decompress</button>
    </div>

    <div id="stats" class="stats"></div>

<script>
let loadedContent = '';
let loadedFileName = '';

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');

dropZone.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('hover');
});

dropZone.addEventListener('dragleave', () => dropZone.classList.remove('hover'));

dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('hover');
    handleFiles(e.dataTransfer.files);
});

function handleFiles(files) {
    if (!files.length) return;
    const file = files[0];
    loadedFileName = file.name;
    const reader = new FileReader();
    reader.onload = (e) => {
        loadedContent = e.target.result;
        dropZone.textContent = 'Selected: ' + file.name;
    };
    reader.readAsText(file);
}

class StorageEngine {
    static compress(string) {
        if (!string) return '';
        let patterns = string.match(/\b\w{4,}\b|[{}[\]()<>=\s]{4,}/g) || [];
        let frequencies = {};
        patterns.forEach(p => { frequencies[p] = (frequencies[p] || 0) + 1; });
        let sortedPatterns = Object.keys(frequencies).sort((a, b) => (b.length * frequencies[b]) - (a.length * frequencies[a]));
        let compressedText = string;
        let mappingTable = [];
        let dictCount = 256;

        for (let pattern of sortedPatterns) {
            if (frequencies[pattern] > 1 && dictCount < 1000) {
                let uniqueToken = `\x01${dictCount}\x02`;
                if (compressedText.includes(pattern)) {
                    compressedText = compressedText.split(pattern).join(uniqueToken);
                    mappingTable.push(`${dictCount}:${pattern}`);
                    dictCount++;
                }
            }
        }
        let packagePayload = mappingTable.join('\x03') + '|||' + compressedText;
        return btoa(unescape(encodeURIComponent(packagePayload)));
    }

    static decompress(base64Package) {
        if (!base64Package) return '';
        let decodedPackage = decodeURIComponent(escape(atob(base64Package)));
        let parts = decodedPackage.split('|||');
        let dictRaw = parts[0];
        let payload = parts[1];
        if (!dictRaw) return payload;
        let mappings = dictRaw.split('\x03');
        let dictionary = {};
        mappings.forEach(m => {
            let kv = m.split(':');
            if (kv[0]) dictionary[kv[0]] = kv.slice(1).join(':');
        });
        let loops = 0;
        let changesOccurred = true;
        while (changesOccurred && loops < 10) {
            changesOccurred = false;
            for (let tokenKey in dictionary) {
                let targetToken = `\x01${tokenKey}\x02`;
                if (payload.includes(targetToken)) {
                    payload = payload.split(targetToken).join(dictionary[tokenKey]);
                    changesOccurred = true;
                }
            }
            loops++;
        }
        return payload;
    }
}

function processFile(isCompress) {
    if (!loadedContent) {
        alert('Please drop a file first.');
        return;
    }

    let output = '';
    let finalFileName = '';

    if (isCompress) {
        output = StorageEngine.compress(loadedContent);
        finalFileName = loadedFileName + '.compressed';
    } else {
        output = StorageEngine.decompress(loadedContent);
        finalFileName = loadedFileName.replace('.compressed', '') || 'decompressed.txt';
    }

    let origSize = new Blob([loadedContent]).size;
    let newSize = new Blob([output]).size;
    
    let stats = document.getElementById('stats');
    stats.innerHTML = 'Original size: ' + origSize + ' bytes<br>' +
                      'New size: ' + newSize + ' bytes<br>' +
                      'Ratio: ' + (origSize / newSize).toFixed(2) + 'x';
    stats.style.display = 'block';

    let blob = new Blob([output], { type: 'text/plain' });
    let link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = finalFileName;
    link.click();
}
</script>
</body>
</html>
