// Self-contained Pitchfinder Implementation
const Pitchfinder = {
    YIN: function(config) {
        const sampleRate = config.sampleRate || 44100;
        const threshold = config.threshold || 0.1;
        return function(float32Data) {
            const bufferSize = float32Data.length;
            const halfBufferSize = Math.floor(bufferSize / 2);
            let yinBuffer = new Float32Array(halfBufferSize);
            let i, tau;
            for (tau = 0; tau < halfBufferSize; tau++) {
                for (i = 0; i < halfBufferSize; i++) {
                    const delta = float32Data[i] - float32Data[i + tau];
                    yinBuffer[tau] += delta * delta;
                }
            }
            let runningSum = 0;
            for (tau = 1; tau < halfBufferSize; tau++) {
                runningSum += yinBuffer[tau];
                yinBuffer[tau] *= tau / runningSum;
            }
            let probability = 1, period = -1;
            for (tau = 1; tau < halfBufferSize; tau++) {
                if (yinBuffer[tau] < threshold) {
                    while (tau + 1 < halfBufferSize && yinBuffer[tau + 1] < yinBuffer[tau]) {
                        tau++;
                    }
                    period = tau;
                    probability = 1 - yinBuffer[tau];
                    break;
                }
            }
            if (period === -1) {
                let minTau = 1;
                let minVal = yinBuffer;
                for (tau = 2; tau < halfBufferSize; tau++) {
                    if (yinBuffer[tau] < minVal) {
                        minVal = yinBuffer[tau];
                        minTau = tau;
                    }
                }
                period = minTau;
                probability = 1 - minVal;
            }
            if (probability > 0.85) {
                return sampleRate / period;
            }
            return null;
        };
    }
};

async function processInput() {
    const youtubeUrl = document.getElementById('youtubeUrl').value.trim();
    const fileInput = document.getElementById('audioFile');
    const statusDiv = document.getElementById('status');

    let arrayBuffer;

    if (youtubeUrl) {
        statusDiv.textContent = "Extracting stream identifiers from YouTube URL...";
        
        // Extract the 11 character video ID matching standard formats
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = youtubeUrl.match(regExp);
        const videoId = (match && match[2].length === 11) ? match[2] : null;

        if (!videoId) {
            alert("Please enter a valid YouTube URL format.");
            statusDiv.textContent = "Error: Invalid URL.";
            return;
        }

        statusDiv.textContent = "Fetching audio from remote proxy streams...";
        try {
            // Utilizing a secure public server to bypass browser CORS network blocks
            const proxyApiUrl = `https://cobalt.tools`;
            const response = await fetch(proxyApiUrl, {
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    url: `https://youtube.com{videoId}`,
                    isAudioOnly: true,
                    audioFormat: 'mp3'
                })
            });

            const data = await response.json();
            if (data && data.url) {
                statusDiv.textContent = "Downloading audio stream into browser buffer memory...";
                const audioFetch = await fetch(data.url);
                arrayBuffer = await audioFetch.arrayBuffer();
            } else {
                throw new Error("Proxy fetch failed");
            }
        } catch (error) {
            console.error(error);
            statusDiv.textContent = "Streaming service timed out. Please fall back to uploading an MP3 directly.";
            return;
        }
    } else if (fileInput.files && fileInput.files.length > 0) {
        statusDiv.textContent = "Reading local file array buffers...";
        const file = fileInput.files[0];
        arrayBuffer = await file.arrayBuffer();
    } else {
        alert("Please provide a YouTube link or choose a local audio track.");
        return;
    }

    // Pass the populated array buffer into our established core logic pipeline
    await analyzeAudioData(arrayBuffer);
}

async function analyzeAudioData(arrayBuffer) {
    const statusDiv = document.getElementById('status');
    const outputArea = document.getElementById('outputCode');

    statusDiv.textContent = "Decoding audio data stream structure...";
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let audioBuffer;
    try {
        audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
    } catch (e) {
        statusDiv.textContent = "Decoding error. Make sure the file format is standard audio data.";
        return;
    }

    statusDiv.textContent = "Analyzing note frequencies and timing details...";
    const float32Data = audioBuffer.getChannelData(0); 
    const sampleRate = audioBuffer.sampleRate;
    
    const detectPitch = Pitchfinder.YIN({ sampleRate: sampleRate });
    const chunkSize = 2048; 
    let songSequence = [];

    for (let i = 0; i < float32Data.length; i += chunkSize) {
        const chunk = float32Data.subarray(i, i + chunkSize);
        const frequency = detectPitch(chunk);
        
        if (frequency) {
            const midiNote = Math.round(12 * (Math.log2(frequency / 440)) + 69);
            if (midiNote >= 24 && midiNote <= 108) {
                const timestampMs = Math.round((i / sampleRate) * 1000);
                songSequence.push({ note: midiNote, time: timestampMs });
            }
        }
    }

    if (songSequence.length === 0) {
        statusDiv.textContent = "Could not detect clear musical notes. Try a simpler solo instrument track.";
        return;
    }
