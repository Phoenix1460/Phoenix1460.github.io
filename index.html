<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Storage Optimizer</title>
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: #ffffff;
            color: #000000;
        }
        .drop-zone {
            border: 2px dashed #000000;
            padding: 40px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .drop-zone.hover {
            background: #f0f0f0;
        }
        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            background: #000000;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: 500;
        }
        button:hover {
            opacity: 0.8;
        }
        .stats {
            font-size: 14px;
            line-height: 1.6;
            border: 1px solid #000000;
            padding: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <h1>File Storage Optimizer</h1>
    
    <div id="dropZone" class="drop-zone">
        Drag and drop your file here, or click to select
        <input type="file" id="fileInput" style="display: none;">
    </div>

    <div class="actions">
        <button onclick="processFile(true)">Compress</button>
        <button onclick="processFile(false)">Decompress</button>
    </div>

    <div id="stats" class="stats"></div>

<script>
let loadedBlob = null;
let loadedFileName = '';

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');

dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('hover');
});

dropZone.addEventListener('dragleave', () => dropZone.classList.remove('hover'));

dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('hover');
    handleFiles(e.dataTransfer.files);
});

function handleFiles(files) {
    if (!files.length) return;
    const file = files[0];
    loadedFileName = file.name;
    loadedBlob = file;
    dropZone.textContent = 'Selected: ' + file.name;
}

async function processFile(isCompress) {
    if (!loadedBlob) {
        alert('Please drop a file first.');
        return;
    }

    let finalBuffer;
    let finalFileName = '';
    
    const fileData = new Uint8Array(await loadedBlob.arrayBuffer());

    try {
        if (isCompress) {
            finalBuffer = pako.deflate(fileData, { level: 9, memLevel: 9 });
            finalFileName = loadedFileName + '.compressed';
        } else {
            finalBuffer = pako.inflate(fileData);
            finalFileName = loadedFileName.replace('.compressed', '') || 'decompressed.txt';
        }
    } catch (e) {
        alert('Processing error. Check if the file matches the operation.');
        return;
    }
    
    let origSize = loadedBlob.size;
    let newSize = finalBuffer.byteLength;
    
    let stats = document.getElementById('stats');
    stats.innerHTML = 'Original size: ' + origSize + ' bytes<br>' +
                      'New size: ' + newSize + ' bytes<br>' +
                      'Ratio: ' + (origSize / newSize).toFixed(2) + 'x';
    stats.style.display = 'block';

    let blob = new Blob([finalBuffer], { type: 'application/octet-stream' });
    let link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = finalFileName;
    link.click();
}
</script>
</body>
</html>
